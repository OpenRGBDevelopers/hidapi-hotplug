#-----------------------------------------------------------#
# Linux (.rpm, F43) 64-bit Build Target                     #
#-----------------------------------------------------------#
"Linux 64 F43 rpm":
  image: fedora:43
  stage: build
  script:
  - dnf install rpmdevtools dnf-plugins-core libcurl-devel qt5-qtbase-devel git -y
  - rpmdev-setuptree
  - cp fedora/hidapi-hotplug.spec /root/rpmbuild/SPECS
  - cp -rp . /root/rpmbuild/SOURCES/hidapi-hotplug
  - cd /root/rpmbuild
  - dnf builddep SPECS/hidapi-hotplug.spec -y
  - rpmbuild -ba SPECS/hidapi-hotplug.spec
  - cd RPMS/x86_64/
  - mv hidapi-hotplug*.rpm ${CI_PROJECT_DIR}/
  - cd ${CI_PROJECT_DIR}

  artifacts:
    name: "${CI_PROJECT_NAME}_Linux_64_rpm_${CI_COMMIT_SHORT_SHA}"
    paths:
    - hidapi-hotplug*.rpm
    expire_in: 30 days

#-----------------------------------------------------------#
# Windows (32-bit) Build Target                             #
#-----------------------------------------------------------#
"Windows 32":
  extends:
  - .shared_windows_runners
  stage: build
  script:
  - $ErrorActionPreference = "SilentlyContinue" ; Set-MpPreference -DisableRealtimeMonitoring $true ; $ErrorActionPreference = "Stop"
  - Push-Location "C:/Program Files (x86)/Microsoft Visual Studio/2022/BuildTools/VC/Auxiliary/Build"
  - '& cmd.exe /C "vcvarsall.bat x86 & set" | Foreach-Object { if ($_ -match "(.*?)=(.*)") { Set-Item -force -path "Env:\$($matches[1])" -value "$($matches[2])" } }'
  - Pop-Location
  - mkdir build
  - cd build
  - cmake -G "Ninja" ..
  - ninja
  artifacts:
    name: "${CI_PROJECT_NAME}_Windows_32_${CI_COMMIT_SHORT_SHA}"
    paths:
    - 'build\src\windows\hidapi-hotplug.dll'
    - 'build\src\windows\hidapi-hotplug.lib'
    expire_in: 30 days

