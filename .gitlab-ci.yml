#-----------------------------------------------------------#
# Linux (.deb) Debian Trixie armhf Build Target             #
#-----------------------------------------------------------#
"Linux armhf .deb (Debian Trixie)":
  variables:
    TGT_ARCH: "armhf"
    TGT_DEB: "trixie"
  <<: *debian_script_steps

#-----------------------------------------------------------#
